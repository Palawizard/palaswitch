[workspace]
resolver = "3"
members = ["crates/palaswitch", "crates/palaswitch-cli", "crates/palaswitch-hidpp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Palawizard/palaswitch"

[workspace.dependencies]
embed-manifest = "1.5.1"
tray-icon = "0.26.1"
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
